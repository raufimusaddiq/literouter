services:
  literouter:
    image: ghcr.io/raufimusaddiq/literouter:1.0.0
    container_name: literouter
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - literouter-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data

volumes:
  literouter-data:
