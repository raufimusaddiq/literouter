services:
  literouter:
    # Required full-SHA tag, published only by .github/workflows/production-image.yml.
    # One writer at a time: stop the 9router container before starting this one,
    # so both never mount 9router-data. See docs/literouter-baseline/production-promotion-plan.md.
    image: ghcr.io/raufimusaddiq/literouter-production:${LITEROUTER_PRODUCTION_TAG:?set production-<full-main-sha>}
    pull_policy: missing
    container_name: literouter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env.production
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      LOG_LEVEL: "${LITEROUTER_LOG_LEVEL:-WARN}"
      ENABLE_REQUEST_LOGS: "true"
      REQUEST_LOG_MAX_SIZE_MB: "1024"
      REQUEST_LOG_MAX_SESSIONS: "1000"
      MODEL_CATALOG_SYNC: "off"
      DISABLE_BACKGROUND_TOKEN_REFRESH: "true"
      REDIS_URL: redis://idx-redis:6379
      REDIS_KEY_PREFIX: "literouter:prod:"
      MINIMAL_PROFILE: "true"
    expose:
      - "20128"
    volumes:
      # Keep the existing production volume name: the durable SQLite state lives
      # here and promotion must never boot against a fresh empty volume.
      - 9router-data:/app/data
    networks:
      # Caddy reaches LiteRouter over this two-member network so the static IP
      # below can never be handed out by idx_default's DHCP pool. Keeping the
      # dynamic idx-public attachment preserves the `9router` DNS name for
      # in-network consumers (richmod, meridian).
      idx-edge:
        ipv4_address: 172.30.0.2
      idx-public:
        aliases:
          # Keep in-network callers working while they migrate to `literouter`.
          - 9router
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:20128/api/auth/status').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  9router-data:
    name: 9router-data

networks:
  idx-public:
    external: true
    name: idx_default
  idx-edge:
    external: true
    name: 9router_edge
