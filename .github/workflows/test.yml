name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: tests

      - run: CI=true bun test --parallel --reporter=junit --reporter-outfile=../test-results.xml
        working-directory: tests

      - name: Tests must not write the real data dir
        run: |
          if [ -e "$HOME/.9router" ]; then
            echo "a test wrote $HOME/.9router"
            find "$HOME/.9router" -maxdepth 3
            exit 1
          fi

      - run: git diff --exit-code -- tests
      - run: test -z "$(git status --porcelain -- tests)"

      - run: bun tests/__baseline__/verify-no-regression.mjs test-results.xml
      - run: bun tests/__baseline__/verify-test-counts.mjs test-results.xml

      - run: bun scripts/migrate-vitest-to-bun.mjs --check tests
      - run: bun scripts/migrate-vitest-to-bun.mjs --snapshots --check tests

      - run: bunx --bun eslint .

      - run: bun scripts/comments/ratchet.mjs --check

      - run: bun scripts/gen-route-table.mjs --check

      - run: bun scripts/port-next-routes.mjs --check src

      - run: bun tests/parity/run.mjs --target bun --out parity-actual

      - run: bun tests/parity/compare.mjs tests/parity/expected parity-actual

      - run: bun tests/parity/compare-upstream.mjs tests/parity/expected parity-actual

      - name: CLI tests
        working-directory: cli
        run: |
          if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi
          bun test

      - run: bun run build

      - run: git diff --exit-code -- src/shared/constants/providerIconManifest.js

      - run: bun scripts/smoke-server.mjs --spawn dist/app

      - run: test "$(du -sm dist/app | cut -f1)" -le 30

  image:
    needs: unit
    runs-on: ubuntu-latest
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: literouter:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - run: bun scripts/check-image-size.mjs literouter:ci --max-mb 150

      - run: bun scripts/smoke-image.mjs literouter:ci --platform ${{ matrix.platform }} --timeout 600
