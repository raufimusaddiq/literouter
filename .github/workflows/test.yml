name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The suite imports app sources, so it needs the runtime deps (next,
      # undici, uuid, …) from the root install as well as the test runner's own.
      # Both are installed with `npm ci` from committed lockfiles, and the
      # Dockerfile does the same, so CI tests the exact dependency graph the
      # image ships.
      - run: npm ci --no-audit --no-fund
      - run: npm ci
        working-directory: tests

      - run: npx vitest run --reporter=dot
        working-directory: tests

      # Catch standalone tracing/dynamic-import regressions before merge.
      - run: npm run build

      - name: Runtime bundle budget
        run: |
          size_mb="$(du -sm .next/standalone | cut -f1)"
          echo "standalone runtime: ${size_mb} MiB"
          test "${size_mb}" -le 140
