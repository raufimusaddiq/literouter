services:
  literouter-staging:
    # Built by .github/workflows/staging-image.yml; this box only pulls.
    # Pin a commit with LITEROUTER_STAGING_TAG=staging-<sha>.
    # Pin commits by exporting LITEROUTER_STAGING_TAG in the shell or `.env`
    # (compose reads `env_file` for the container only, not for its own vars).
    image: ghcr.io/raufimusaddiq/literouter-staging:${LITEROUTER_STAGING_TAG:-staging-latest}
    pull_policy: always
    container_name: literouter-staging
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATA_DIR: /app/data
      PORT: "20129"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      ENABLE_REQUEST_LOGS: "true"
      REQUEST_LOG_MAX_SIZE_MB: "256"
      REQUEST_LOG_MAX_SESSIONS: "250"
      MODEL_CATALOG_SYNC: "off"
      DISABLE_BACKGROUND_TOKEN_REFRESH: "true"
      REDIS_URL: redis://idx-redis:6379
      REDIS_KEY_PREFIX: "literouter:staging:"
      MINIMAL_PROFILE: "true"
    ports:
      - "127.0.0.1:20129:20129"
    volumes:
      - literouter-staging-data:/app/data
    networks:
      - literouter-staging
      - idx-default
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20129/api/auth/status').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  literouter-staging-data:
    name: literouter-staging-data

networks:
  literouter-staging:
    name: literouter-staging
  idx-default:
    external: true
    name: idx_default
